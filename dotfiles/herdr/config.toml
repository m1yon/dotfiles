# Herdr configuration
# Reference: https://herdr.dev/docs/configuration/

onboarding = false

[theme]
name = "catppuccin"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
# Use Ctrl-Space as a leader-like prefix without intercepting plain Space.
prefix = "ctrl+space"

# General actions
help = "prefix+?"
settings = "prefix+comma"
detach = "prefix+q"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+o"

# Workspaces
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# Tabs use Neovim's terminal, bracket navigation, and buffer-delete vocabulary.
new_tab = "prefix+t"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+["
next_tab = "prefix+]"
switch_tab = "prefix+1..9"
close_tab = "prefix+d"

# Pane actions mirror Neovim's Ctrl-W vocabulary after the Herdr prefix.
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
copy_mode = "prefix+y"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+c"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

# Keep pane movement in navigate mode consistent with Neovim. Herdr reserves
# Up/Down for workspace movement because those actions share this mode.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[update]
channel = "stable"
