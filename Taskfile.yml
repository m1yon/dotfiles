version: "3"

vars:
  FLAKE_DIR: ~/GitHub/dotfiles

tasks:
  rebuild:
    desc: Rebuild NixOS and switch to new configuration
    cmd: nixos-rebuild switch --flake {{.FLAKE_DIR}} --sudo

  rebuild-home:
    desc: Rebuild Home Manager configuration independently
    cmd: nix run home-manager -- switch --flake {{.FLAKE_DIR}}

  format:
    desc: Format all Nix files with nixfmt
    dir: "{{.FLAKE_DIR}}"
    cmd: git ls-files '*.nix' | xargs -r nixfmt

  update-llm-agents:
    desc: Update the llm-agents flake input and rebuild
    cmds:
      - nix flake update llm-agents --flake {{.FLAKE_DIR}}
      - task: rebuild

  update-nixpkgs:
    desc: Update the nixpkgs flake input and rebuild
    cmds:
      - nix flake update nixpkgs --flake {{.FLAKE_DIR}}
      - task: rebuild
