version: "3"

vars:
  FLAKE_DIR: "{{.TASKFILE_DIR}}"

tasks:
  rebuild:
    desc: Rebuild system configuration and switch
    cmds:
      - |
        case "$(uname -s)" in
          Darwin)
            if darwin_rebuild="$(command -v darwin-rebuild 2>/dev/null)"; then
              sudo "$darwin_rebuild" switch --flake {{.FLAKE_DIR}}#macbook
            else
              sudo nix --extra-experimental-features 'nix-command flakes' run github:nix-darwin/nix-darwin/nix-darwin-25.11#darwin-rebuild -- switch --flake {{.FLAKE_DIR}}#macbook
            fi
            ;;
          Linux)
            nixos-rebuild switch --flake {{.FLAKE_DIR}}#nixbook --sudo
            restart-app vicinae server
            ;;
          *)
            echo "Unsupported OS: $(uname -s)" >&2
            exit 1
            ;;
        esac

  rebuild-home:
    desc: Rebuild Home Manager configuration independently
    cmds:
      - |
        case "$(uname -s)" in
          Darwin)
            nix run home-manager -- switch --flake {{.FLAKE_DIR}}#michael@macbook
            ;;
          Linux)
            nix run home-manager -- switch --flake {{.FLAKE_DIR}}#michael@nixbook
            restart-app vicinae server
            ;;
          *)
            echo "Unsupported OS: $(uname -s)" >&2
            exit 1
            ;;
        esac

  format:
    desc: Format all Nix files with nixfmt
    dir: "{{.FLAKE_DIR}}"
    cmd: |
      git ls-files --cached --others --exclude-standard '*.nix' | while IFS= read -r file; do
        if [ -e "$file" ]; then
          nixfmt "$file"
        fi
      done

  update-llm-agents:
    desc: Update the llm-agents flake input and rebuild
    cmds:
      - nix flake update llm-agents --flake {{.FLAKE_DIR}}
      - task: rebuild

  setup:
    desc: Run all setup tasks for a fresh machine
    cmd: bash {{.FLAKE_DIR}}/setup.sh

  sops-age-key:
    desc: Convert SSH ed25519 key to age key for sops CLI
    cmd: mkdir -p ~/.config/sops/age && nix shell nixpkgs#ssh-to-age -c ssh-to-age -private-key -i ~/.ssh/id_ed25519 > ~/.config/sops/age/keys.txt
    status:
      - test -s ~/.config/sops/age/keys.txt

  sops-edit:
    desc: "Edit a sops secrets file (usage: task sops-edit -- aws.yaml)"
    cmd: sops {{.FLAKE_DIR}}/secrets/{{.CLI_ARGS}}

  update-all:
    desc: Update all flake inputs and rebuild
    cmds:
      - nix flake update --flake {{.FLAKE_DIR}}
      - task: rebuild

  update-nixpkgs:
    desc: Update the nixpkgs flake input and rebuild
    cmds:
      - nix flake update nixpkgs --flake {{.FLAKE_DIR}}
      - task: rebuild

  onedrive-reauth:
    desc: "Linux only: re-authenticate an OneDrive instance (usage: task onedrive-reauth -- personal|carecoordinators)"
    cmds:
      - systemctl --user stop onedrive-{{.CLI_ARGS}}
      - onedrive --confdir=~/.config/onedrive-{{.CLI_ARGS}} --reauth --sync
      - systemctl --user start onedrive-{{.CLI_ARGS}}

  onedrive-status:
    desc: "Linux only: show status of all OneDrive sync services"
    cmds:
      - systemctl --user status onedrive-personal --no-pager
      - systemctl --user status onedrive-carecoordinators --no-pager
