version: "3"

vars:
  FLAKE_DIR: ~/GitHub/dotfiles

tasks:
  rebuild:
    desc: Rebuild NixOS and switch to new configuration
    cmd: nixos-rebuild switch --flake {{.FLAKE_DIR}} --sudo

  rebuild-home:
    desc: Rebuild Home Manager configuration independently
    cmd: nix run home-manager -- switch --flake {{.FLAKE_DIR}}

  format:
    desc: Format all Nix files with nixfmt
    dir: "{{.FLAKE_DIR}}"
    cmd: git ls-files '*.nix' | xargs -r nixfmt

  update-llm-agents:
    desc: Update the llm-agents flake input and rebuild
    cmds:
      - nix flake update llm-agents --flake {{.FLAKE_DIR}}
      - task: rebuild

  setup:
    desc: Run all setup tasks for a fresh machine
    cmds:
      - task: sops-age-key
      - task: onedrive-reauth
        vars: { CLI_ARGS: personal }
      - task: onedrive-reauth
        vars: { CLI_ARGS: carecoordinators }

  sops-age-key:
    desc: Convert SSH ed25519 key to age key for sops CLI
    cmd: mkdir -p ~/.config/sops/age && nix shell nixpkgs#ssh-to-age -c ssh-to-age -private-key -i ~/.ssh/id_ed25519 > ~/.config/sops/age/keys.txt
    status:
      - test -s ~/.config/sops/age/keys.txt

  sops-edit:
    desc: "Edit a sops secrets file (usage: task sops-edit -- aws.yaml)"
    cmd: sops {{.FLAKE_DIR}}/secrets/{{.CLI_ARGS}}

  update-nixpkgs:
    desc: Update the nixpkgs flake input and rebuild
    cmds:
      - nix flake update nixpkgs --flake {{.FLAKE_DIR}}
      - task: rebuild

  onedrive-reauth:
    desc: "Re-authenticate an OneDrive instance (usage: task onedrive-reauth -- personal|carecoordinators)"
    cmds:
      - systemctl --user stop onedrive-{{.CLI_ARGS}}
      - onedrive --confdir=~/.config/onedrive-{{.CLI_ARGS}} --reauth --sync
      - systemctl --user start onedrive-{{.CLI_ARGS}}

  onedrive-status:
    desc: Show status of all OneDrive sync services
    cmds:
      - systemctl --user status onedrive-personal --no-pager
      - systemctl --user status onedrive-carecoordinators --no-pager
